name: Nix build

on:
  push:
  pull_request:

jobs:
  build-nix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        # Gitea Actions runs each job inside Docker; the nested Nix sandbox
        # cannot load its seccomp filter in that environment.
        extra_nix_config: |
          sandbox = false
    #- uses: DeterminateSystems/magic-nix-cache-action@v13
    # Keep the single x86 runner below its memory limit; the default parallel
    # build can be OOM-killed while compiling the server closure.
    - run: nix build -L -j 1
    - run: nix develop --command echo OK
    - run: nix flake check -vL -j 1
