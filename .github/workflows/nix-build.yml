name: Nix build

on:
  push:
  pull_request:

jobs:
  build-nix:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
      with:
        # Gitea runs this job in a container without a service manager. Keep
        # Nix in the job container instead of relying on a separate daemon.
        install_options: --no-daemon
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          sandbox = true
    #- uses: DeterminateSystems/magic-nix-cache-action@v13
    # Keep the single x86 runner below its memory limit; the default parallel
    # build can be OOM-killed while compiling the server closure.
    - run: nix --option sandbox true show-config | grep '^sandbox'
    - run: nix --option sandbox true build -L -j 1
    - run: nix --option sandbox true develop --command echo OK
    - run: nix --option sandbox true flake check -vL -j 1
